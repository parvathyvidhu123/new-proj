<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#eaac08" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#eaac08" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <circle cx="400" cy="450" r="320" fill="url(#goldGlow)" />

  <!-- Subtle sacred geometry / tattoo mandala lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" fill="none">
    <circle cx="400" cy="450" r="260" stroke-dasharray="6,8" />
    <circle cx="400" cy="450" r="200" />
    <circle cx="400" cy="450" r="140" stroke-dasharray="4,6" />
    <polygon points="400,210 590,540 210,540" />
    <polygon points="400,690 590,360 210,360" />
  </g>

  <!-- Outer Card Frame -->
  <rect x="40" y="40" width="720" height="920" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Corner accents -->
  <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
  <path d="M 740 90 L 740 60 L 710 60" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
  <path d="M 60 910 L 60 940 L 90 940" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
  <path d="M 740 910 L 740 940 L 710 940" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" />

  <!-- Top Tag -->
  <text x="400" y="110" fill="#a1a1aa" font-family="monospace, sans-serif" font-size="14" letter-spacing="6" text-anchor="middle">
    BLACKHOLE TATTOO COLLECTIVE
  </text>
  <text x="400" y="140" fill="#eab308" font-family="monospace, sans-serif" font-size="12" letter-spacing="4" text-anchor="middle">
    ✦ GUEST &amp; FREELANCE ARTIST ✦
  </text>

  <!-- Central Crest / Initials -->
  <circle cx="400" cy="420" r="90" fill="#09090b" stroke="#eab308" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="400" cy="420" r="82" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4,4" />
  
  <text x="400" y="435" fill="url(#goldText)" font-family="sans-serif" font-weight="900" font-size="44" letter-spacing="4" text-anchor="middle">
    DDA
  </text>

  <!-- Artist Name & Details -->
  <text x="400" y="580" fill="#f4f4f5" font-family="sans-serif" font-weight="900" font-size="38" letter-spacing="3" text-anchor="middle">
    DEEPU D ART
  </text>
  
  <text x="400" y="625" fill="#eab308" font-family="sans-serif" font-weight="600" font-size="16" letter-spacing="5" text-anchor="middle">
    FREELANCE ARTIST
  </text>

  <line x1="340" y1="655" x2="460" y2="655" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.5" />

  <text x="400" y="695" fill="#d4d4d8" font-family="monospace, sans-serif" font-weight="500" font-size="18" letter-spacing="4" text-anchor="middle">
    10 YEARS EXPERIENCE
  </text>

  <text x="400" y="735" fill="#71717a" font-family="sans-serif" font-size="14" letter-spacing="2" text-anchor="middle">
    ALL STYLES • CUSTOM CONCEPTS • BLACK &amp; GREY
  </text>

  <!-- Bottom Badge -->
  <rect x="230" y="830" width="340" height="46" rx="23" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
  <circle cx="260" cy="853" r="4" fill="#eab308" />
  <text x="410" y="859" fill="#a1a1aa" font-family="monospace, sans-serif" font-size="12" letter-spacing="3" text-anchor="middle">
    PORTFOLIO UPDATING SOON
  </text>
</svg>
